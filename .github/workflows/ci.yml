name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  equivalencia:
    name: Equivalência nas 5 linguagens (spike)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem com os runtimes
        run: docker build -t educai-runtimes spike
      - name: Rodar spike
        run: |
          set -o pipefail
          docker run --rm educai-runtimes node run.mjs --estrito --markdown | tee -a "$GITHUB_STEP_SUMMARY"
